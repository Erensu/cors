  <!-- baselines from master A -->
  <g stroke="#9aa7b4" stroke-width="1.2" stroke-dasharray="5 4" fill="none">
    <line x1="300" y1="196" x2="300" y2="120"/>
    <line x1="292" y1="204" x2="140" y2="268"/>
    <line x1="298" y1="212" x2="292" y2="304"/>
    <line x1="308" y1="208" x2="420" y2="288"/>
    <line x1="310" y1="196" x2="478" y2="140"/>
  </g>

  <!-- master A on top layer -->
  <use href="#twr" x="300" y="250"/>
  <use href="#twr" x="300" y="130"/>
  <use href="#twr" x="140" y="310"/>
  <use href="#twr" x="292" y="346"/>
  <use href="#twr" x="420" y="330"/>
  <use href="#twr" x="478" y="182"/>

  <text x="300" y="272" text-anchor="middle" font-size="13" fill="#1e5a97" font-weight="600">Master reference station <tspan font-style="italic">A</tspan></text>
  <text x="300" y="52"  text-anchor="middle" font-size="13" fill="#3d5166">Reference station <tspan font-style="italic">B</tspan><tspan font-size="10" dy="3">1</tspan></text>
  <text x="112" y="332" text-anchor="middle" font-size="13" fill="#3d5166">Reference station <tspan font-style="italic">B</tspan><tspan font-size="10" dy="3">2</tspan></text>
  <text x="270" y="368" text-anchor="middle" font-size="13" fill="#3d5166">Reference station <tspan font-style="italic">B</tspan><tspan font-size="10" dy="3">3</tspan></text>
  <text x="446" y="352" text-anchor="middle" font-size="13" fill="#3d5166">Reference station <tspan font-style="italic">B</tspan><tspan font-size="10" dy="3">4</tspan></text>
  <text x="508" y="204" text-anchor="middle" font-size="13" fill="#3d5166">Reference station <tspan font-style="italic">B</tspan><tspan font-size="10" dy="3" font-style="italic">n</tspan></text>
</svg>
