      <line x1="-11.5" y1="-14" x2="11.5" y2="-14" stroke="#3d5166" stroke-width="1.1"/>
      <line x1="-6" y1="-28" x2="6" y2="-28" stroke="#3d5166" stroke-width="1.1"/>
      <line x1="-11.5" y1="-14" x2="6" y2="-28" stroke="#3d5166" stroke-width="0.9"/>
      <line x1="11.5" y1="-14" x2="-6" y2="-28" stroke="#3d5166" stroke-width="0.9"/>
      <line x1="-3" y1="0" x2="0" y2="-14" stroke="#3d5166" stroke-width="0.9"/>
      <line x1="3" y1="0" x2="0" y2="-14" stroke="#3d5166" stroke-width="0.9"/>
      <line x1="-6" y1="-14" x2="0" y2="-28" stroke="#3d5166" stroke-width="0.9"/>
      <line x1="6" y1="-14" x2="0" y2="-28" stroke="#3d5166" stroke-width="0.9"/>
      <line x1="0" y1="-42" x2="0" y2="-52" stroke="#3d5166" stroke-width="1.5"/>
      <path d="M -6 -55 a 8.5 8.5 0 0 1 12 0" fill="none" stroke="#2f6fb4" stroke-width="1.4"/>
      <path d="M -9.5 -59.5 a 13.5 13.5 0 0 1 19 0" fill="none" stroke="#7fa8d0" stroke-width="1.3"/>
    </g>
